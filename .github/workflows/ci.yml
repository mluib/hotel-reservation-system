name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Program.cs fails fast at startup if Jwt:Key is missing (Phase 6 secrets hardening) --
      # locally that's covered by user-secrets or the committed .env, neither of which reach
      # this CI runner, so it needs its own value here. Same dev-only placeholder already
      # committed in the repo-root .env, not a real secret, so a plain env var is enough --
      # no need for a GitHub Actions secret.
      Jwt__Key: ql8UiF/DgXWrZniua1SrrhAWE8QhNDWBZOwrAtlTGuE=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore HotelReservationSystem.slnx
      - run: dotnet build HotelReservationSystem.slnx --no-restore -c Release
      - run: dotnet test HotelReservationSystem.slnx --no-build -c Release

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - run: npm run lint
